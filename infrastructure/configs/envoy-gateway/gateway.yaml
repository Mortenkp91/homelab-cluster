apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: envoy-gateway-system
  annotations:
    # After the EnvoyProxy it references, so the Service is created with its pinned IP.
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: homelab-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.mkped.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: mkped-wildcard-certificate-secret
      allowedRoutes:
        namespaces:
          from: All
