# Makes the node answer ARP for every LoadBalancer IP on the LAN interface, so the addresses from
# the pool are reachable from the rest of the network without BGP.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab
spec:
  loadBalancerIPs: true
  interfaces:
    - ^enp2s0$
