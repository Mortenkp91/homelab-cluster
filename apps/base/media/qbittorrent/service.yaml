kind: Service
apiVersion: v1
metadata:
  name: qbittorrent-tcp-svc            
  namespace: media
spec:
  selector:
    app: qbittorrent       
  ports:                      
  - port: 8080             
    targetPort: 8080      
    name: web-ui         
    protocol: TCP
  type: ClusterIP
---
kind: Service
apiVersion: v1
metadata:
  name: qbittorrent-udp-svc
  namespace: media
  annotations:
    # The address this Service has had since the first cluster (the router forwards 6881 to it).
    # Pinned so a rebuilt cluster does not hand it the first free address of the pool instead.
    lbipam.cilium.io/ips: "10.20.22.12"
spec:
  selector:
    app: qbittorrent       
  ports:
  - port: 6881               
    targetPort: 6881        
    name: torrent-udp         
    protocol: UDP
  - port: 6881
    targetPort: 6881
    name: torrent-tcp
    protocol: TCP  
  type: LoadBalancer # for port-fowarding
