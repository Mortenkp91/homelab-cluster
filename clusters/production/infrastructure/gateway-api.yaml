apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/Mortenkp91/homelab-cluster.git
    targetRevision: main
    path: infrastructure/production/gateway-api
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Deleting a CRD deletes every Gateway and HTTPRoute in the cluster with it. A CRD that
      # disappears from the vendored bundle is left in place and removed by hand.
      prune: false
      selfHeal: true
    syncOptions:
      # Required: the CRDs are too large for the client-side apply last-applied annotation.
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
