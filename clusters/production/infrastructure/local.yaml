apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/Mortenkp91/homelab-cluster.git
    targetRevision: main
    path: infrastructure/production/local
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # The PVs carry Prune=false (infrastructure/base/local/kustomization.yaml), so a PV removed from
      # Git is never deleted by Argo CD. With prune off the Application just stays OutOfSync until
      # the PV is deleted by hand, instead of retrying a sync that cannot converge.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
